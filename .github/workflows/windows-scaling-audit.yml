name: Windows display scaling and browser zoom
on:
  push:
    branches: [codex/windows-scaling-20261124]
permissions:
  contents: read
jobs:
  scaling:
    runs-on: windows-2022
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        include:
          - { display: '1920x1080', scale: 100, zoom: '100' }
          - { display: '1920x1080', scale: 125, zoom: '100,125,150' }
          - { display: '1920x1080', scale: 150, zoom: '125,150,200' }
          - { display: '1366x768', scale: 150, zoom: '100,125,150,200' }
          - { display: '1366x768', scale: 175, zoom: '125,150' }
    env:
      AUDIT_DISPLAY: ${{ matrix.display }}
      AUDIT_SCALE: ${{ matrix.scale }}
      AUDIT_ZOOM_LEVELS: ${{ matrix.zoom }}
      AUDIT_VERSION: '2026-11-24-dashboard-image-size-r1'
      NODE_PATH: ${{ runner.temp }}/scale-check/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium on the cloud runner
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/scale-check" --no-save --ignore-scripts playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:NODE_PATH/playwright/cli.js" install chromium
      - name: Check the live sites at Windows display scaling and browser zoom combinations
        run: node scripts/audit-windows-scaling.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaling-${{ matrix.display }}-${{ matrix.scale }}
          path: qa-results/
          retention-days: 14
