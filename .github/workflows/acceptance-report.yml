name: Acceptance report checks
on:
  push:
    branches: [codex/acceptance-report-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/package-pages.mjs _site-check
      - name: Prepare cloud browser
        run: |
          echo "NODE_PATH=$RUNNER_TEMP/browser-check/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-save --ignore-scripts playwright@1.56.1 axe-core@4.11.0
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium
      - run: node scripts/check-acceptance-report.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: qa-results/
          retention-days: 14
