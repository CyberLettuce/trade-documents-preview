name: PDF and input acceptance checks
on:
  push:
    branches: [codex/acceptance-extras-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CHECK_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/vue/*.test.mjs
      - run: node scripts/package-pages.mjs _site-check
      - name: Prepare cloud browser
        run: |
          echo "NODE_PATH=$RUNNER_TEMP/browser-check/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-save --ignore-scripts playwright@1.56.1 axe-core@4.11.0 pdf-lib@1.17.1
          "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps "${{ matrix.browser }}"
      - name: PDF, print, text spacing and keyboard checks
        run: node scripts/check-acceptance-extras.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-extras-${{ matrix.browser }}
          path: qa-results/
          retention-days: 14
