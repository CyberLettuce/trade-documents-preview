name: Check React and Vue interfaces
on:
  push:
    branches: [codex/options-dashboard-20261117, codex/sidebar-collapse-20261119]
    paths: ['index.html', 'assets/**', 'vue/**', 'scripts/**', 'tests/**', '.github/workflows/interface-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check business rules
        run: node --test tests/vue/*.test.mjs
      - name: Package preview
        run: node scripts/package-pages.mjs _site-check
      - name: Prepare cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-save --ignore-scripts playwright@1.56.1
          if command -v google-chrome >/dev/null; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/browser-check/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Check layouts and interactions
        env:
          NODE_PATH: ${{ runner.temp }}/browser-check/node_modules
        run: |
          node scripts/check-interface.cjs
          node scripts/check-sidebar.cjs
          node scripts/check-editor-navigation.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-evidence
          path: qa-results/
          retention-days: 7
