name: Chamber pending application layout preview
on:
  push:
    branches: [codex/pending-review-preview-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user pwuser
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      CHECK_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/vue/*.test.mjs
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: node scripts/package-pages.mjs _site-check
      - name: Prepare cloud browser
        run: |
          echo "NODE_PATH=$RUNNER_TEMP/browser-check/node_modules" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/browser-check" --no-save --ignore-scripts playwright@1.56.1 axe-core@4.11.0 pdf-lib@1.17.1
      - name: Chamber preview size, zoom and application details
        run: node scripts/check-pack-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pending-review-${{ matrix.browser }}
          path: qa-results/
          retention-days: 14
